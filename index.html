<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    
    <!-- Force Google to use VinilsAi as the Site Name -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "VinilsAi",
      "alternateName": "VinilAI",
      "url": "https://vinils-ai.github.io/vinilsai/"
    }
    </script>

    <!-- Point to your real PNG favicon logo -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- Primary Meta Tags (ONLY ONE TITLE TAG HERE) -->
    <title>VinilsAi - Your AI Assistant</title>
    <meta name="title" content="VinilsAi - Your AI Assistant" />
    <meta name="description" content="VinilsAi is a custom intelligent AI assistant created by Vinil Yadav. Chat, ask questions, and explore real-time AI responses." />
    <meta name="keywords" content="VinilsAi, Vinil Yadav, Vinil AI, Custom AI, AI Chatbot" />
    <meta name="author" content="Vinil Yadav" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VinilsAi - Intelligent AI Assistant" />
    <meta property="og:description" content="Chat with VinilsAi, an AI chatbot built from scratch." />
    <meta property="og:url" content="https://vinils-ai.github.io/vinilsai/" />
  
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        background: #ffffff;
        color: #0d0d0d;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* 3-Second Splash Screen */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.5s ease-out;
      }

      .splash-logo {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #0d0d0d 0%, #333333 100%);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        animation: pulse 1.8s infinite ease-in-out;
        margin-bottom: 20px;
      }

      .splash-logo svg {
        width: 44px;
        height: 44px;
        fill: #ffffff;
      }

      .splash-title {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #0d0d0d;
      }

      .splash-subtitle {
        font-size: 0.85rem;
        color: #666;
        margin-top: 6px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }

      /* Left Sidebar */
      #sidebar {
        width: 260px;
        background: #f9f9f9;
        border-right: 1px solid #e5e5e5;
        display: flex;
        flex-direction: column;
        transition: transform 0.3s ease;
        z-index: 10;
      }

      .sidebar-header {
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #e5e5e5;
      }

      .new-chat-btn {
        background: #ffffff;
        border: 1px solid #e5e5e5;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        color: #0d0d0d;
        width: 100%;
        text-align: left;
      }

      .new-chat-btn:hover {
        background: #ececec;
      }

      .recent-chats {
        flex: 1;
        overflow-y: auto;
        padding: 12px 8px;
      }

      .recent-title {
        font-size: 0.75rem;
        font-weight: 600;
        color: #666;
        margin-bottom: 8px;
        padding-left: 8px;
      }

      .chat-item {
        padding: 10px 8px;
        border-radius: 8px;
        font-size: 0.9rem;
        color: #333;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .chat-item:hover {
        background: #ececec;
      }

      /* Main Chat Container */
      #main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        position: relative;
        background: #ffffff;
      }

      /* Mobile Header Controls */
      .top-bar {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid #f0f0f0;
      }

      .menu-toggle {
        background: none;
        border: none;
        font-size: 1.2rem;
        cursor: pointer;
        margin-right: 12px;
        color: #0d0d0d;
      }

      .app-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: #0d0d0d;
      }

      /* Chat Messages Box */
      #chat-box {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 768px;
        width: 100%;
        margin: 0 auto;
      }

      /* Welcome Title on Empty Screen */
      .welcome-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #0d0d0d;
      }

      .welcome-title {
        font-size: 2.2rem;
        font-weight: 600;
        margin-bottom: 8px;
      }

      /* Message Bubbles */
      .msg {
        max-width: 85%;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 0.95rem;
        line-height: 1.5;
        word-wrap: break-word;
        white-space: pre-wrap;
      }

      .user-msg {
        align-self: flex-end;
        background: #f4f4f4;
        color: #0d0d0d;
        border-bottom-right-radius: 4px;
      }

      .ai-msg {
        align-self: flex-start;
        background: #ffffff;
        color: #0d0d0d;
        border-bottom-left-radius: 4px;
        border: 1px solid #f0f0f0;
      }

      /* Loading Spinner */
      .loader-container {
        align-self: flex-start;
        display: flex;
        align-items: center;
        padding: 8px 12px;
      }

      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid #e5e5e5;
        border-top: 2px solid #0d0d0d;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Input Box Area */
      .input-wrapper {
        padding: 16px;
        background: #ffffff;
        max-width: 768px;
        width: 100%;
        margin: 0 auto;
      }

      .input-container {
        display: flex;
        align-items: center;
        border: 1px solid #e5e5e5;
        border-radius: 24px;
        padding: 8px 16px;
        background: #ffffff;
        box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      }

      input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 1rem;
        background: transparent;
        color: #0d0d0d;
        padding: 8px 0;
      }

      .send-btn {
        background: #0d0d0d;
        color: #ffffff;
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-weight: bold;
        margin-left: 8px;
      }

      .send-btn:disabled {
        background: #e5e5e5;
        cursor: not-allowed;
      }

      /* Responsive Mobile Layout */
      @media (max-width: 768px) {
        #sidebar {
          position: absolute;
          height: 100%;
          transform: translateX(-100%);
        }
        #sidebar.active {
          transform: translateX(0);
        }
      }
    </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-logo">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div class="splash-title">VinilsAi</div>
    <div class="splash-subtitle">Next-Gen Intelligent Assistant</div>
  </div>

  <!-- Sidebar Component -->
  <div id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn">+ New Chat</button>
    </div>
    <div class="recent-chats">
      <div class="recent-title">Recent Chats</div>
      <!-- Dynamically generated chat items go here -->
    </div>
  </div>

  <!-- Main Chat Frame -->
  <div id="main-content">
    <div class="top-bar">
      <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('active')">☰</button>
      <div class="app-title">VinilsAi</div>
    </div>

    <!-- Scrollable Chat Messages Container -->
    <div id="chat-box">
      <div class="welcome-screen">
        <h1 class="welcome-title">VinilsAi</h1>
        <p style="color: #666;">How can I help you today?</p>
      </div>
    </div>

    <!-- Input Form Block -->
    <div class="input-wrapper">
      <div class="input-container">
        <input type="text" placeholder="Message VinilsAi..." id="user-input" />
        <button class="send-btn" id="submit-btn">&gt;</button>
      </div>
    </div>
  </div>

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        splash.style.opacity = '0';
        setTimeout(() => {

<!DOCTYPE html>
<html lang="en">
<head>

</script>

<!-- Point to your real PNG favicon -->

<meta name="title" content="VinilsAi - Your AI Assistant" />
<meta name="description" content="VinilsAi is a custom intelligent AI assistant created by Vinil Yadav. Chat, ask questions, and explore real-time AI responses." />
<meta name="keywords" content="VinilsAi, Vinil Yadav, Vinil AI, Custom AI, AI Chatbot" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VinilsAi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #ffffff;
      color: #0d0d0d;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* 3-Second Splash Screen */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.5s ease-out;
    }

    .splash-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #0d0d0d 0%, #333333 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      animation: pulse 1.8s infinite ease-in-out;
      margin-bottom: 20px;
    }

    .splash-logo svg {
      width: 44px;
      height: 44px;
      fill: #ffffff;
    }

    .splash-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #0d0d0d;
    }

    .splash-subtitle {
      font-size: 0.85rem;
      color: #666;
      margin-top: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* Left Sidebar */
    #sidebar {
      width: 260px;
      background: #f9f9f9;
      border-right: 1px solid #e5e5e5;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      z-index: 10;
    }

    .sidebar-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e5e5;
    }

    .new-chat-btn {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: #0d0d0d;
      width: 100%;
      text-align: left;
    }

    .new-chat-btn:hover {
      background: #ececec;
    }

    .recent-chats {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
    }

    .recent-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: #666;
      margin-bottom: 8px;
      padding-left: 8px;
    }

    .chat-item {
      padding: 10px 8px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item:hover {
      background: #ececec;
    }

    /* Main Chat Container */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #ffffff;
    }

    /* Mobile Header Controls */
    .top-bar {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
    }

    .menu-toggle {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      margin-right: 12px;
      color: #0d0d0d;
    }

    .app-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0d0d0d;
    }

    /* Chat Messages Box */
    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 768px;
      width: 100%;
      margin: 0 auto;
    }

    /* Welcome Title on Empty Screen */
    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #0d0d0d;
    }

    .welcome-title {
      font-size: 2.2rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    /* Message Bubbles */
    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap; /* Fixes proper spacing formatting */
    }

    .user-msg {
      align-self: flex-end;
      background: #f4f4f4;
      color: #0d0d0d;
      border-bottom-right-radius: 4px;
    }

    .ai-msg {
      align-self: flex-start;
      background: #ffffff;
      color: #0d0d0d;
      border-bottom-left-radius: 4px;
      border: 1px solid #f0f0f0;
    }

    /* Loading Spinner */
    .loader-container {
      align-self: flex-start;
      display: flex;
      align-items: center;
      padding: 8px 12px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #e5e5e5;
      border-top: 2px solid #0d0d0d;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Input Box Area */
    .input-wrapper {
      padding: 16px;
      background: #ffffff;
      max-width: 768px;
      width: 100%;
      margin: 0 auto;
    }

    .input-container {
      display: flex;
      align-items: center;
      border: 1px solid #e5e5e5;
      border-radius: 24px;
      padding: 8px 16px;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1rem;
      background: transparent;
      color: #0d0d0d;
      padding: 8px 0;
    }

    .send-btn {
      background: #0d0d0d;
      color: #ffffff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      margin-left: 8px;
    }

    .send-btn:disabled {
      background: #e5e5e5;
      cursor: not-allowed;
    }

    /* Responsive Mobile Layout */
    @media (max-width: 768px) {
      #sidebar {
        position: absolute;
        height: 100%;
        transform: translateX(-100%);
      }
      #sidebar.active {
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>

  <!-- Splash Screen (3 Seconds) -->
  <div id="splash-screen">
    <div class="splash-logo">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
      </svg>
    </div>
    <div class="splash-title">VinilsAi</div>
    <div class="splash-subtitle">Next-Gen Intelligent Assistant</div>
  </div>

  <!-- Left Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
    </div>
    <div class="recent-chats">
      <div class="recent-title">Recent Chats</div>
      <div id="recent-list"></div>
    </div>
  </div>

  <!-- Main View -->
  <div id="main-content">
    <div class="top-bar">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <div class="app-title">VinilsAi</div>
    </div>

    <div id="chat-box">
      <div class="welcome-screen" id="welcomeScreen">
        <h1 class="welcome-title">VinilsAi</h1>
      </div>
    </div>

    <div class="input-wrapper">
      <div class="input-container">
        <input type="text" id="userInput" placeholder="Message VinilsAi..." />
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
      </div>
    </div>
  </div>

  <script>
    const RENDER_BACKEND_URL = "https://my-custom-ai-backend.onrender.com";

    // Splash Screen Timer (3 Seconds)
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        const splash = document.getElementById("splash-screen");
        splash.style.opacity = "0";
        setTimeout(() => {
          splash.style.display = "none";
        }, 500); // 500ms fade transition
      }, 3000);
    });

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("active");
    }

    function startNewChat() {
      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML = `
        <div class="welcome-screen" id="welcomeScreen">
          <h1 class="welcome-title">VinilsAi</h1>
        </div>
      `;
      if (window.innerWidth <= 768) {
        document.getElementById("sidebar").classList.remove("active");
      }
    }

    function addRecentChat(titleText) {
      const recentList = document.getElementById("recent-list");
      const chatItem = document.createElement("div");
      chatItem.className = "chat-item";
      chatItem.innerText = titleText;
      recentList.prepend(chatItem);
    }

    // Fixed Typewriter Function preserves string spaces properly
    function typeWriterEffect(element, text, speed = 20) {
      let i = 0;
      element.textContent = ""; 
      function type() {
        if (i < text.length) {
          element.textContent += text.charAt(i);
          i++;
          const chatBox = document.getElementById("chat-box");
          chatBox.scrollTop = chatBox.scrollHeight;
          setTimeout(type, speed);
        }
      }
      type();
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      const sendBtn = document.getElementById("sendBtn");
      const chatBox = document.getElementById("chat-box");
      const welcomeScreen = document.getElementById("welcomeScreen");

      if (!text) return;

      if (welcomeScreen) {
        welcomeScreen.remove();
        addRecentChat(text);
      }

      // Render User Message
      const userDiv = document.createElement("div");
      userDiv.className = "msg user-msg";
      userDiv.innerText = text;
      chatBox.appendChild(userDiv);

      input.value = "";
      sendBtn.disabled = true;
      chatBox.scrollTop = chatBox.scrollHeight;

      // Render Loading Spinner
      const loaderContainer = document.createElement("div");
      loaderContainer.className = "loader-container";
      loaderContainer.innerHTML = `<div class="spinner"></div>`;
      chatBox.appendChild(loaderContainer);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(`${RENDER_BACKEND_URL}/predict`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        loaderContainer.remove();

        const aiDiv = document.createElement("div");
        aiDiv.className = "msg ai-msg";
        chatBox.appendChild(aiDiv);

        const replyText = data.reply || "Sorry, I couldn't process that.";
        typeWriterEffect(aiDiv, replyText);

      } catch (error) {
        loaderContainer.remove();
        const errorDiv = document.createElement("div");
        errorDiv.className = "msg ai-msg";
        errorDiv.innerText = "Error connecting to AI backend server.";
        chatBox.appendChild(errorDiv);
        console.error(error);
      } finally {
        sendBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    document.getElementById("userInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
